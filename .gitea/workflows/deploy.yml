name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: new-api
  IMAGE_TAG: latest
  IMAGE_TAR: new-api-local.tar
  DEPLOY_HOST: 113.44.182.60
  DEPLOY_USER: root
  DEPLOY_ROOT: /www/wwwroot
  DEPLOY_APP_DIR: /www/wwwroot/new-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

      - name: Build Docker image
        run: |
          docker build --platform linux/amd64 -t "${IMAGE_NAME}:${IMAGE_TAG}" .

      - name: Save Docker image
        run: |
          docker save -o "${IMAGE_TAR}" "${IMAGE_NAME}:${IMAGE_TAG}"
          ls -lh "${IMAGE_TAR}"

      - name: Upload image archive
        run: |
          scp -i ~/.ssh/deploy_key "${IMAGE_TAR}" "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_ROOT}/${IMAGE_TAR}"

      - name: Load image and restart service
        run: |
          ssh -i ~/.ssh/deploy_key "${DEPLOY_USER}@${DEPLOY_HOST}" <<'EOF'
          set -euo pipefail
          docker load -i /www/wwwroot/new-api-local.tar
          docker tag new-api:latest new-api-local
          cd /www/wwwroot/new-api
          if command -v docker-compose >/dev/null 2>&1; then
            docker-compose down
            docker-compose up -d
          else
            docker compose down
            docker compose up -d
          fi
          EOF
